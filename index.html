<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/atmos-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eaf2fb" />
    <meta
      name="description"
      content="Atmos — a modern weather intelligence platform. Live conditions, forecasts, air quality, maps and insights."
    />
    <title>Atmos — Weather Intelligence</title>
    <script>
      var t = localStorage.getItem('atmos.theme')
      var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      if (dark) document.querySelector('meta[name=theme-color]').setAttribute('content', '#0b1120')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
